<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Glass Box — live LLM interpretability dashboard">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f7530"/>
      <stop offset="35%" stop-color="#e8cf86"/>
      <stop offset="65%" stop-color="#d4b45c"/>
      <stop offset="100%" stop-color="#7d6528"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07070a" stop-opacity="1"/>
      <stop offset="18%" stop-color="#07070a" stop-opacity="0"/>
      <stop offset="82%" stop-color="#07070a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07070a" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <style>
      .plate{fill:#0c0c11;stroke:#23232c;stroke-width:1.2}
      .dot{fill:#d4b45c;filter:url(#glow);animation:fl 2.8s ease-in-out infinite}
      .cool{fill:#5f93b8}
      .arc{fill:none;stroke:#d4b45c;stroke-opacity:.5;stroke-width:1.4;
           stroke-dasharray:6 10;animation:flow 2.2s linear infinite}
      .scan{animation:sweep 6s ease-in-out infinite}
      .rise{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
      @keyframes fl{0%,100%{opacity:.14}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-32}}
      @keyframes sweep{0%,100%{transform:translateX(0);opacity:0}
        8%{opacity:.9}92%{opacity:.9}50%{transform:translateX(1020px)}}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      @media(prefers-reduced-motion:reduce){
        .dot,.arc,.scan,.rise{animation:none}.dot{opacity:.75}.scan{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#vig)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <g class="rise">
    <text x="600" y="112" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
          font-size="76" font-weight="700" letter-spacing="17" fill="url(#brass)">GLASS BOX</text>
    <text x="600" y="152" text-anchor="middle" font-family="Courier New,monospace"
          font-size="14.5" letter-spacing="7.5" fill="#7f7f8b">LIVE  LLM  INTERPRETABILITY  DASHBOARD</text>
    <line x1="470" y1="176" x2="730" y2="176" stroke="#d4b45c" stroke-opacity=".35"/>
    <text x="600" y="204" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
          font-size="16.5" fill="#b9b9c4">Watch a language model think in real time — then reach inside and change its mind.</text>
  </g>

  <g id="stack">
    <g class="plate-row">
      <rect class="plate" x="90"   y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="192"  y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="294"  y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="396"  y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="498"  y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="600"  y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="702"  y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="804"  y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="906"  y="234" width="26" height="128" rx="13"/>
      <rect class="plate" x="1008" y="234" width="26" height="128" rx="13"/>
    </g>
  </g>
  <g id="neurons">
    <circle class="dot" cx="103"  cy="256" r="3.2" style="animation-delay:.05s"/>
    <circle class="dot" cx="103"  cy="304" r="2.6" style="animation-delay:.9s"/>
    <circle class="dot" cx="103"  cy="340" r="3"   style="animation-delay:1.7s"/>
    <circle class="dot" cx="205"  cy="272" r="3.4" style="animation-delay:.35s"/>
    <circle class="dot cool" cx="205" cy="326" r="2.4" style="animation-delay:1.4s"/>
    <circle class="dot" cx="307"  cy="250" r="2.8" style="animation-delay:.7s"/>
    <circle class="dot" cx="307"  cy="312" r="3.6" style="animation-delay:1.15s"/>
    <circle class="dot" cx="409"  cy="288" r="3.1" style="animation-delay:.2s"/>
    <circle class="dot cool" cx="409" cy="348" r="2.5" style="animation-delay:2.1s"/>
    <circle class="dot" cx="511"  cy="262" r="3.8" style="animation-delay:1.55s"/>
    <circle class="dot" cx="511"  cy="320" r="2.7" style="animation-delay:.5s"/>
    <circle class="dot" cx="613"  cy="244" r="2.9" style="animation-delay:1.95s"/>
    <circle class="dot" cx="613"  cy="298" r="4"   style="animation-delay:.8s"/>
    <circle class="dot" cx="613"  cy="352" r="2.6" style="animation-delay:1.3s"/>
    <circle class="dot" cx="715"  cy="278" r="3.3" style="animation-delay:.6s"/>
    <circle class="dot cool" cx="715" cy="334" r="2.4" style="animation-delay:1.8s"/>
    <circle class="dot" cx="817"  cy="256" r="3"   style="animation-delay:1.05s"/>
    <circle class="dot" cx="817"  cy="310" r="3.5" style="animation-delay:.25s"/>
    <circle class="dot" cx="919"  cy="290" r="2.8" style="animation-delay:1.6s"/>
    <circle class="dot" cx="919"  cy="344" r="3.2" style="animation-delay:.45s"/>
    <circle class="dot" cx="1021" cy="266" r="3.6" style="animation-delay:1.25s"/>
    <circle class="dot" cx="1021" cy="322" r="2.9" style="animation-delay:2.2s"/>
  </g>

  <g id="attention">
    <path class="arc" d="M103 298 C 160 210, 250 210, 307 298" style="animation-delay:0s"/>
    <path class="arc" d="M205 298 C 300 190, 420 190, 511 298" style="animation-delay:.4s"/>
    <path class="arc" d="M307 298 C 400 216, 520 216, 613 298" style="animation-delay:.8s"/>
    <path class="arc" d="M511 298 C 590 200, 730 200, 817 298" style="animation-delay:.2s"/>
    <path class="arc" d="M613 298 C 700 220, 830 220, 919 298" style="animation-delay:1s"/>
    <path class="arc" d="M715 298 C 800 214, 940 214, 1021 298" style="animation-delay:.6s"/>
    <path class="arc" d="M103 298 C 300 400, 700 400, 1021 298" style="animation-delay:1.4s"/>
  </g>

  <rect class="scan" x="88" y="228" width="6" height="140" fill="#e8cf86" opacity="0"/>
  <rect width="1200" height="420" fill="url(#fade)" pointer-events="none"/>

  <g font-family="Courier New,monospace" font-size="11" letter-spacing="3" fill="#5c5c68">
    <text x="103" y="386">L0</text>
    <text x="601" y="386">L6</text>
    <text x="1013" y="386">L11</text>
    <text x="600" y="408" text-anchor="middle" fill="#6f6f7c" letter-spacing="4.5">
      ATTENTION  ·  NEURONS  ·  LOGIT LENS  ·  ACTIVATION STEERING
    </text>
  </g>
</svg>
