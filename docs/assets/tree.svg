<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="The response tree: chosen tokens on the spine, rejected candidates kept as branches">
  <defs>
    <filter id="g3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:Courier New,monospace}
      .cap{font-size:10.5px;letter-spacing:2.6px;fill:#6e6e7a;
           font-family:Helvetica Neue,Helvetica,Arial,sans-serif}
      .spine{fill:none;stroke:#d4b45c;stroke-opacity:.75;stroke-width:2;
             stroke-dasharray:900;stroke-dashoffset:900;animation:draw 5s ease-out infinite}
      .win{fill:#e8cf86;filter:url(#g3);animation:pop 5s ease-out infinite both}
      .wt{font-size:12.5px;fill:#e8cf86;animation:pop 5s ease-out infinite both}
      .alt{fill:#4e4e5a;animation:dim 5s ease-out infinite both}
      .at{font-size:10.5px;fill:#63636f;animation:dim 5s ease-out infinite both}
      .twig{fill:none;stroke:#2e2e38;stroke-width:1;animation:dim 5s ease-out infinite both}
      .limb{fill:none;stroke:#5f93b8;stroke-opacity:.6;stroke-width:1.4;
            stroke-dasharray:260;stroke-dashoffset:260;animation:draw2 5s ease-out infinite}
      @keyframes draw{0%{stroke-dashoffset:900}70%,100%{stroke-dashoffset:0}}
      @keyframes draw2{0%,55%{stroke-dashoffset:260}90%,100%{stroke-dashoffset:0}}
      @keyframes pop{0%{opacity:0}12%,100%{opacity:1}}
      @keyframes dim{0%{opacity:0}14%,100%{opacity:1}}
      @media(prefers-reduced-motion:reduce){
        .spine,.limb{animation:none;stroke-dashoffset:0}
        .win,.wt,.alt,.at,.twig{animation:none;opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="400" fill="#07070a"/>
  <text class="cap" x="34" y="36">THE RESPONSE TREE — EVERY TOKEN THE MODEL WEIGHED, KEPT ON SCREEN</text>
  <text x="34" y="60" font-size="11.5" fill="#7f7f8b">prompt: "The Golden Gate Bridge is a famous"</text>

  <!-- the spine: the path the model actually took -->
  <path class="spine" d="M150 220 H990"/>

  <g id="chosen">
    <circle class="win" cx="150" cy="220" r="7"   style="animation-delay:.1s"/>
    <circle class="win" cx="290" cy="220" r="6.4" style="animation-delay:.7s"/>
    <circle class="win" cx="430" cy="220" r="7.4" style="animation-delay:1.3s"/>
    <circle class="win" cx="570" cy="220" r="8"   style="animation-delay:1.9s"/>
    <circle class="win" cx="710" cy="220" r="6"   style="animation-delay:2.5s"/>
    <circle class="win" cx="850" cy="220" r="7"   style="animation-delay:3.1s"/>
    <circle class="win" cx="990" cy="220" r="5.6" style="animation-delay:3.7s"/>
  </g>

  <g text-anchor="middle">
    <text class="wt" x="150" y="250" style="animation-delay:.1s">landmark</text>
    <text class="wt" x="290" y="250" style="animation-delay:.7s">in</text>
    <text class="wt" x="430" y="250" style="animation-delay:1.3s">San</text>
    <text class="wt" x="570" y="250" style="animation-delay:1.9s">Francisco</text>
    <text class="wt" x="710" y="250" style="animation-delay:2.5s">,</text>
    <text class="wt" x="850" y="250" style="animation-delay:3.1s">California</text>
    <text class="wt" x="990" y="250" style="animation-delay:3.7s">.</text>
  </g>

  <g font-size="9.5" fill="#55555f" text-anchor="middle">
    <text class="at" x="150" y="266" style="animation-delay:.1s">0.41</text>
    <text class="at" x="290" y="266" style="animation-delay:.7s">0.78</text>
    <text class="at" x="430" y="266" style="animation-delay:1.3s">0.55</text>
    <text class="at" x="570" y="266" style="animation-delay:1.9s">0.96</text>
    <text class="at" x="710" y="266" style="animation-delay:2.5s">0.34</text>
    <text class="at" x="850" y="266" style="animation-delay:3.1s">0.62</text>
    <text class="at" x="990" y="266" style="animation-delay:3.7s">0.49</text>
  </g>
  <!-- rejected candidates: dimmed, but never deleted -->
  <g id="rejected">
    <g style="animation-delay:.3s">
      <path class="twig" d="M150 213 C150 190, 150 176, 150 158" style="animation-delay:.3s"/>
      <path class="twig" d="M150 213 C130 186, 118 150, 112 120" style="animation-delay:.4s"/>
      <path class="twig" d="M150 227 C150 254, 150 276, 150 300" style="animation-delay:.5s"/>
      <circle class="alt" cx="150" cy="152" r="4"   style="animation-delay:.3s"/>
      <circle class="alt" cx="110" cy="114" r="3.2" style="animation-delay:.4s"/>
      <circle class="alt" cx="150" cy="306" r="3"   style="animation-delay:.5s"/>
      <text class="at" x="164" y="150" style="animation-delay:.3s">symbol · 0.19</text>
      <text class="at" x="124" y="112" style="animation-delay:.4s">structure · 0.11</text>
      <text class="at" x="164" y="309" style="animation-delay:.5s">tourist · 0.07</text>
    </g>
    <g>
      <path class="twig" d="M290 227 C290 258, 290 282, 290 306" style="animation-delay:.9s"/>
      <circle class="alt" cx="290" cy="312" r="3.4" style="animation-delay:.9s"/>
      <text class="at" x="304" y="315" style="animation-delay:.9s">of · 0.09</text>
    </g>
    <g>
      <path class="twig" d="M430 213 C430 190, 430 172, 430 152" style="animation-delay:1.5s"/>
      <path class="twig" d="M430 227 C430 256, 430 280, 430 304" style="animation-delay:1.6s"/>
      <circle class="alt" cx="430" cy="146" r="5" style="animation-delay:1.5s"/>
      <circle class="alt" cx="430" cy="310" r="3" style="animation-delay:1.6s"/>
      <text class="at" x="444" y="143" style="animation-delay:1.5s">the · 0.21</text>
      <text class="at" x="444" y="313" style="animation-delay:1.6s">northern · 0.08</text>
    </g>
    <g>
      <path class="twig" d="M710 213 C710 192, 710 176, 710 156" style="animation-delay:2.7s"/>
      <path class="twig" d="M710 227 C710 256, 710 280, 710 304" style="animation-delay:2.8s"/>
      <circle class="alt" cx="710" cy="150" r="4.6" style="animation-delay:2.7s"/>
      <circle class="alt" cx="710" cy="310" r="3.6" style="animation-delay:2.8s"/>
      <text class="at" x="724" y="147" style="animation-delay:2.7s">and · 0.28</text>
      <text class="at" x="724" y="313" style="animation-delay:2.8s">. · 0.15</text>
    </g>
    <g>
      <path class="twig" d="M850 227 C850 256, 850 280, 850 304" style="animation-delay:3.3s"/>
      <circle class="alt" cx="850" cy="310" r="3.4" style="animation-delay:3.3s"/>
      <text class="at" x="864" y="313" style="animation-delay:3.3s">the · 0.14</text>
    </g>
  </g>

  <!-- a branch the user re-rolled: it claims its own row and keeps growing -->
  <path class="limb" d="M430 146 C500 132, 560 124, 640 116 H860"/>
  <g fill="#5f93b8" filter="url(#g3)">
    <circle cx="640" cy="116" r="5"/><circle cx="750" cy="116" r="4.4"/><circle cx="860" cy="116" r="4"/>
  </g>
  <g font-size="11.5" fill="#7fb2d4" text-anchor="middle">
    <text x="640" y="102">Bay</text><text x="750" y="102">Area</text><text x="860" y="102">skyline</text>
  </g>
  <text x="900" y="120" font-size="9.5" fill="#4d6f88">← branch re-rolled from "the"</text>

  <!-- legend -->
  <g class="cap" font-size="10">
    <circle cx="42" cy="356" r="5" fill="#e8cf86"/>
    <text x="56" y="360" fill="#8b8b97">chosen — neurons fire on this node</text>
    <circle cx="330" cy="356" r="4" fill="#4e4e5a"/>
    <text x="344" y="360" fill="#8b8b97">weighed and rejected — double-click to take it instead</text>
    <circle cx="770" cy="356" r="4.4" fill="#5f93b8"/>
    <text x="784" y="360" fill="#8b8b97">explored branch — kept forever, on its own row</text>
  </g>
</svg>
